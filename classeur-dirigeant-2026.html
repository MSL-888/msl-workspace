<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Le Classeur du Dirigeant 2026</title>
<style>
:root {
  --dark:   #1A3A6B;
  --darker: #0D2547;
  --mid:    #1E4280;
  --accent: #C9A84C;
  --alight: #E0C876;
  --apale:  #FBF5E4;
  --white:  #ffffff;
  --surface:#F7F9FC;
  --border: #D6DFEE;
  --line:   #EEF2F8;
  --muted:  #7B93BE;
  --text:   #1A3A6B;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Georgia',serif;background:#8899BB;}

/* ── PAGE ── */
.page{
  width:210mm;min-height:297mm;height:297mm;
  background:white;margin:6mm auto;
  position:relative;overflow:hidden;
  page-break-after:always;page-break-inside:avoid;
}
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
  body{background:white;}
  .page{margin:0;page-break-after:always;page-break-inside:avoid;}
  .no-print{display:none!important;}
  @page{size:A4;margin:0;}
}

/* ── NAV ── */
#nav{
  position:fixed;top:0;left:0;right:0;
  background:var(--darker);color:white;
  padding:8px 16px;display:flex;align-items:center;
  gap:10px;z-index:999;font-family:Arial,sans-serif;font-size:12px;
  flex-wrap:wrap;
}
#nav strong{color:var(--alight);margin-right:4px;}
#nav a{color:var(--muted);text-decoration:none;padding:3px 8px;border-radius:3px;}
#nav a:hover{background:rgba(201,168,76,.25);color:white;}
#printbtn{
  margin-left:auto;background:var(--accent);color:var(--darker);
  border:none;padding:5px 14px;border-radius:4px;cursor:pointer;
  font-weight:bold;font-size:12px;font-family:Arial,sans-serif;
}
#planner{padding-top:52px;}

/* ── TYPOGRAPHY ── */
.sans{font-family:Arial,'Helvetica Neue',sans-serif;}

/* ── SECTION HEADER ── */
.sh{
  background:var(--dark);color:white;
  display:flex;align-items:center;gap:8px;
  padding:4px 10px;font-family:Arial,sans-serif;
  font-size:7pt;font-weight:bold;letter-spacing:1px;
  text-transform:uppercase;
}
.sn{
  background:var(--accent);color:var(--darker);
  padding:1px 6px;border-radius:2px;font-size:6.5pt;
  font-weight:bold;min-width:18px;text-align:center;
}
.sr{margin-left:auto;font-size:6pt;color:var(--muted);font-weight:normal;letter-spacing:.3px;}

/* ── FOOTER ── */
.pf{
  position:absolute;bottom:5mm;left:12mm;right:12mm;
  display:flex;justify-content:space-between;
  font-size:5.5pt;color:#A0BADE;font-family:Arial,sans-serif;
  border-top:.5px solid var(--border);padding-top:2px;
  letter-spacing:.3px;
}

/* ── CONTENT AREA ── */
.pc{padding:6mm 12mm 14mm;}
.intro{font-size:7pt;color:var(--muted);font-family:Arial,sans-serif;margin-bottom:5mm;font-style:italic;}

/* ── BOX ── */
.box{border:1px solid var(--border);border-radius:3px;padding:3.5mm 4mm;margin-bottom:3mm;}
.bh{
  font-size:6.5pt;font-weight:bold;color:var(--dark);
  letter-spacing:.6px;text-transform:uppercase;font-family:Arial,sans-serif;
  margin-bottom:2.5mm;display:flex;align-items:center;gap:4px;
  border-bottom:1px solid var(--border);padding-bottom:1.5mm;
}
.bi{
  display:inline-flex;align-items:center;justify-content:center;
  width:13px;height:13px;background:var(--dark);color:white;
  border-radius:50%;font-size:6.5pt;font-weight:bold;flex-shrink:0;
}
.bia{
  display:inline-flex;align-items:center;justify-content:center;
  width:13px;height:13px;background:var(--accent);color:var(--darker);
  border-radius:50%;font-size:6.5pt;font-weight:bold;flex-shrink:0;
}

/* ── LINES ── */
.ln{border-bottom:.5px solid var(--line);min-height:6.5mm;}
.lnm{min-height:8mm;}

/* ── CHECKBOX / CIRCLE / DOT ── */
.cb{display:inline-block;width:8px;height:8px;border:1px solid #A0BADE;border-radius:1px;flex-shrink:0;}
.circ{
  display:inline-flex;align-items:center;justify-content:center;
  width:14px;height:14px;border:1.5px solid var(--accent);border-radius:50%;
  font-size:7pt;font-weight:bold;color:var(--accent);font-family:Arial,sans-serif;flex-shrink:0;
}
.dot{width:6px;height:6px;border:1px solid #A0BADE;border-radius:50%;display:inline-block;flex-shrink:0;}

/* ── COLS ── */
.cols{display:flex;gap:3mm;}
.col{flex:1;}

/* ── TABLE ── */
.dt{width:100%;border-collapse:collapse;font-family:Arial,sans-serif;font-size:6pt;}
.dt th{background:var(--dark);color:white;padding:2.5px 5px;text-align:left;font-size:5.5pt;font-weight:bold;letter-spacing:.4px;text-transform:uppercase;white-space:nowrap;}
.dt td{border-bottom:.5px solid var(--line);padding:1px 5px;height:6.5mm;vertical-align:bottom;}
.dt .c{text-align:center;}
.dt tr:nth-child(even) td{background:rgba(241,245,249,.4);}

/* ── COVER ── */
.cover-page{
  background:var(--darker)!important;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:20mm;position:relative;
}
.cover-page::before,.cover-page::after{
  content:'';position:absolute;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--accent),var(--alight),var(--accent));
}
.cover-page::before{top:0;}
.cover-page::after{bottom:0;}
.cover-inner{
  border:1.5px solid rgba(201,168,76,.4);border-radius:3px;
  padding:18mm 16mm;width:100%;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:8mm;
}
.c-logo{
  width:20mm;height:20mm;border-radius:50%;border:2px solid var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-family:Arial,sans-serif;font-size:16pt;font-weight:bold;
  color:var(--alight);letter-spacing:1px;
}
.c-title{font-size:26pt;font-weight:bold;color:white;letter-spacing:2px;line-height:1.2;}
.c-year{font-size:16pt;color:var(--accent);letter-spacing:4px;font-family:Arial,sans-serif;font-weight:300;}
.c-div{width:18mm;height:2px;background:var(--accent);border-radius:1px;}
.c-tag{font-size:7.5pt;color:var(--muted);letter-spacing:2.5px;text-transform:uppercase;font-family:Arial,sans-serif;}
.c-rbar{position:absolute;right:0;top:14mm;bottom:14mm;width:9mm;background:var(--accent);opacity:.8;}

/* ── CYCLE COVER (split: dark top / white bottom) ── */
.cc-top{
  background:var(--darker);color:white;
  padding:9mm 14mm 7mm;height:96mm;position:relative;
}
.cc-label{font-size:6.5pt;letter-spacing:2.5px;color:var(--muted);text-transform:uppercase;font-family:Arial,sans-serif;}
.cc-label::after{content:'';display:block;width:16mm;height:2px;background:var(--accent);margin-top:2mm;}
.cc-num{font-size:60pt;font-weight:bold;color:var(--accent);line-height:1;margin:2mm 0 0;}
.cc-month{font-size:20pt;font-weight:bold;color:white;letter-spacing:2px;}
.cc-dates{margin-top:5mm;font-family:Arial,sans-serif;font-size:7pt;display:flex;flex-direction:column;gap:3mm;}
.cc-date{display:flex;align-items:center;gap:5mm;}
.cc-date strong{color:var(--accent);font-size:6pt;text-transform:uppercase;letter-spacing:1px;min-width:10mm;}
.cc-date em{border-bottom:1px solid rgba(201,168,76,.35);width:45mm;display:inline-block;height:5mm;font-style:normal;}
.cc-bar{position:absolute;right:0;top:8mm;bottom:8mm;width:8mm;background:var(--accent);}
.cc-bot{background:white;padding:6mm 12mm 14mm;}
.cc-fdl{position:absolute;bottom:5mm;left:12mm;right:12mm;display:flex;justify-content:space-between;font-size:5.5pt;color:rgba(160,186,222,.5);font-family:Arial,sans-serif;letter-spacing:.3px;}

/* ── WEEKLY PLAN ── */
.wk-day{display:flex;border-bottom:1px solid var(--border);}
.wk-day:last-child{border-bottom:none;}
.wk-day-lbl{
  width:16mm;min-width:16mm;
  background:var(--dark);color:white;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:2mm;border-right:2.5px solid var(--accent);
}
.wk-day-lbl .dn{font-size:8pt;font-weight:bold;font-family:Arial,sans-serif;letter-spacing:.5px;}
.wk-day-lbl .dd{font-size:14pt;font-weight:bold;color:var(--accent);font-family:Arial,sans-serif;line-height:1;}
.wk-day-body{flex:1;padding:2mm 3mm;display:flex;flex-direction:column;gap:.8mm;}
.wk-day-body .rl{font-size:5.5pt;color:var(--muted);font-family:Arial,sans-serif;font-weight:bold;letter-spacing:.5px;text-transform:uppercase;}
.wk-day-focus{border-bottom:1px solid var(--line);height:7mm;}
.wk-act{display:flex;gap:2mm;margin-top:.5mm;}
.wk-act-lbl{font-size:5.5pt;color:var(--muted);font-family:Arial,sans-serif;font-weight:bold;white-space:nowrap;margin-top:1px;letter-spacing:.3px;}
.wk-act-lines{flex:1;display:flex;flex-direction:column;gap:.5mm;}
.wk-act-row{display:flex;align-items:flex-end;gap:2mm;}
.wk-act-row .cb{margin-bottom:1px;}
.wk-act-row div{flex:1;border-bottom:.5px solid var(--line);height:5mm;}

/* ── IDENTITY FIELDS ── */
.idf{display:flex;align-items:flex-end;gap:4mm;margin-bottom:4mm;}
.ifl{font-size:8pt;color:var(--dark);font-family:Arial,sans-serif;white-space:nowrap;min-width:28mm;}
.ifv{flex:1;border-bottom:1px solid var(--dark);height:5mm;}

/* ── DOT GRID ── */
.dotgrid{
  border:1px solid var(--border);border-radius:3px;flex:1;
  background-image:radial-gradient(circle,#C0CCDC .7px,transparent .7px);
  background-size:5mm 5mm;background-position:3mm 3mm;
}

/* ── SCALE ── */
.scale{display:flex;align-items:center;gap:3mm;margin-bottom:2.5mm;font-family:Arial,sans-serif;font-size:7pt;}
.scale-lbl{min-width:40mm;color:var(--dark);}
.scale-dots{display:flex;gap:2mm;}
.sdot{width:9px;height:9px;border:1px solid #A0BADE;border-radius:50%;}

/* ── AZ INDEX ── */
.az{position:absolute;right:3mm;top:24mm;display:flex;flex-direction:column;gap:1px;}
.az-l{font-size:5.5pt;font-family:Arial,sans-serif;color:var(--muted);text-align:center;width:7mm;padding:1.5px;background:var(--line);border-radius:1px;line-height:1;}
</style>
</head>
<body>

<div id="nav" class="no-print">
  <strong>Classeur du Dirigeant 2026</strong>
  <a href="#cover">Couverture</a>
  <a href="#annuaire">Annuaire</a>
  <span id="cyclelinks"></span>
  <button id="printbtn" onclick="window.print()">⎙ Imprimer / PDF</button>
</div>

<div id="planner"></div>

<script>
// ═══════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════
const MONTHS = [
  {n:1, name:'JANVIER',   fr:'Janvier',   days:31, start:new Date(2026,0,1)},
  {n:2, name:'FÉVRIER',   fr:'Février',   days:28, start:new Date(2026,1,1)},
  {n:3, name:'MARS',      fr:'Mars',      days:31, start:new Date(2026,2,1)},
  {n:4, name:'AVRIL',     fr:'Avril',     days:30, start:new Date(2026,3,1)},
  {n:5, name:'MAI',       fr:'Mai',       days:31, start:new Date(2026,4,1)},
  {n:6, name:'JUIN',      fr:'Juin',      days:30, start:new Date(2026,5,1)},
  {n:7, name:'JUILLET',   fr:'Juillet',   days:31, start:new Date(2026,6,1)},
  {n:8, name:'AOÛT',      fr:'Août',      days:31, start:new Date(2026,7,1)},
  {n:9, name:'SEPTEMBRE', fr:'Septembre', days:30, start:new Date(2026,8,1)},
  {n:10,name:'OCTOBRE',   fr:'Octobre',   days:31, start:new Date(2026,9,1)},
  {n:11,name:'NOVEMBRE',  fr:'Novembre',  days:30, start:new Date(2026,10,1)},
  {n:12,name:'DÉCEMBRE',  fr:'Décembre',  days:31, start:new Date(2026,11,1)}
];
const JFULL=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const JSHORT=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
const MFULL=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];

// ═══════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════
const p2=n=>String(n).padStart(2,'0');

function fmtDate(d){
  return `${JFULL[d.getDay()]} ${d.getDate()} ${MFULL[d.getMonth()]} 2026`;
}
function fmtShort(d){
  return `${p2(d.getDate())}/${p2(d.getMonth()+1)}/2026`;
}

function lines(n,cls=''){
  return Array(n).fill(`<div class="ln ${cls}"></div>`).join('');
}
function cblines(n){
  return Array(n).fill(0).map(()=>
    `<div class="ln" style="display:flex;align-items:flex-end;gap:3mm;padding-bottom:1px;">
      <span class="cb"></span>
      <div style="flex:1;border-bottom:.5px solid var(--line);"></div>
    </div>`
  ).join('');
}
function dotlines(n){
  return Array(n).fill(0).map(()=>
    `<div class="ln" style="display:flex;align-items:flex-end;gap:3mm;padding-bottom:1px;">
      <span class="dot"></span>
      <div style="flex:1;border-bottom:.5px solid var(--line);"></div>
    </div>`
  ).join('');
}
function numlines(n){
  return Array(n).fill(0).map((_,i)=>
    `<div class="ln" style="display:flex;align-items:flex-end;gap:3mm;padding-bottom:1px;">
      <span style="font-size:6.5pt;color:var(--muted);font-family:Arial;min-width:8px;">${i+1}.</span>
      <div style="flex:1;border-bottom:.5px solid var(--line);"></div>
    </div>`
  ).join('');
}

function pf(l,r){
  return `<div class="pf"><span>${l}</span><span>${r}</span></div>`;
}

// Compute weeks (Mon-Sun) covering a month
function getWeeks(m){
  const weeks=[];
  const mEnd=new Date(m.start);mEnd.setDate(mEnd.getDate()+m.days-1);
  let cur=new Date(m.start);
  const dow=cur.getDay();
  const off=dow===0?-6:1-dow;
  cur.setDate(cur.getDate()+off);
  let wn=1;
  while(cur<=mEnd && wn<=6){
    const wk=[];
    for(let i=0;i<7;i++){
      const d=new Date(cur);d.setDate(d.getDate()+i);
      const inM=d>=m.start&&d<=mEnd;
      wk.push({date:d,inMonth:inM});
    }
    weeks.push(wk);
    cur.setDate(cur.getDate()+7);
    wn++;
  }
  return weeks;
}

// ═══════════════════════════════════════════
// PAGE: COUVERTURE
// ═══════════════════════════════════════════
function genCover(){
  return `<div class="page cover-page" id="cover">
    <div class="cover-inner">
      <div class="c-logo">CD</div>
      <div class="c-div"></div>
      <div class="c-title">LE CLASSEUR<br>DU DIRIGEANT</div>
      <div class="c-div"></div>
      <div class="c-year">2026</div>
      <div style="height:10mm;"></div>
      <div class="c-tag">Clarté &nbsp;·&nbsp; Priorités &nbsp;·&nbsp; Exécution</div>
    </div>
    <div class="c-rbar"></div>
  </div>`;
}

// ═══════════════════════════════════════════
// PAGE: IDENTITÉ + INTRO (combined)
// ═══════════════════════════════════════════
function genIdentityIntro(){
  const fields=['Nom et prénom','Société','Fonction','Téléphone','E-mail'];
  return `<div class="page">
    <div class="sh"><span class="sn">01–02</span> IDENTITÉ ET MODE D'EMPLOI</div>
    <div class="pc" style="padding-top:5mm;">

      <!-- Identity -->
      <div style="display:flex;gap:10mm;align-items:flex-start;margin-bottom:5mm;">
        <div style="flex:1;">
          <div style="font-size:9.5pt;font-weight:bold;color:var(--dark);letter-spacing:1px;margin-bottom:4mm;">LE CLASSEUR DU DIRIGEANT <span style="color:var(--accent);">2026</span></div>
          ${fields.map(f=>`<div class="idf"><span class="ifl">${f}</span><div class="ifv"></div></div>`).join('')}
        </div>
        <div style="text-align:center;min-width:28mm;">
          <div style="width:22mm;height:22mm;border-radius:50%;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:16pt;font-weight:bold;color:var(--accent);margin:0 auto 3mm;">CD</div>
          <div style="font-size:6pt;color:var(--muted);font-family:Arial;letter-spacing:.5px;">Cet outil appartient à</div>
        </div>
      </div>

      <div style="height:1px;background:var(--border);margin-bottom:5mm;"></div>

      <!-- Intro compact -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:3mm;">

        <div class="box" style="border-color:var(--dark);">
          <div class="bh"><div class="bi">O</div> LE PRINCIPE</div>
          <p style="font-size:7pt;color:#374151;line-height:1.55;font-family:Arial,sans-serif;">Le Classeur du Dirigeant sert à choisir ce qui compte vraiment, à le planifier, puis à le suivre jusqu'au résultat. Chaque cycle de 31 jours commence par trois priorités majeures et se termine par une revue de progression.</p>
        </div>

        <div class="box">
          <div class="bh"><div class="bi">#</div> PROTOCOLE</div>
          ${[
            'Définir le cap : 3 priorités, résultats, décisions.',
            'Collecter toutes les tâches, attribuer un jour 01–31.',
            'Chaque matin : choisir les 3 actions critiques.',
            'Mettre à jour communications, délégations, attentes.',
            'Fin de cycle : analyser, ajuster, préparer le suivant.'
          ].map((t,i)=>`<div style="display:flex;gap:3mm;align-items:flex-start;margin-bottom:2mm;">
            <div class="bia" style="font-size:6pt;">${i+1}</div>
            <div style="font-size:6.5pt;color:#374151;font-family:Arial;line-height:1.4;">${t}</div>
          </div>`).join('')}
        </div>

        <div class="box">
          <div class="bh"><div class="bi">*</div> 3 RENDEZ-VOUS QUOTIDIENS</div>
          ${[
            ['Matin','Choisir le résultat principal + 3 actions critiques.'],
            ['Journée','Conserver le cap, noter, ne pas oublier.'],
            ['Soir','Fermer la boucle, planifier demain, relancer.']
          ].map(([t,d])=>`<div style="display:flex;gap:3mm;margin-bottom:2.5mm;align-items:flex-start;">
            <div style="width:14px;height:14px;min-width:14px;background:var(--apale);border:1px solid var(--accent);border-radius:2px;display:flex;align-items:center;justify-content:center;"><div style="width:5px;height:5px;background:var(--accent);border-radius:50%;"></div></div>
            <div style="font-size:6.5pt;font-family:Arial;line-height:1.4;"><strong style="color:var(--dark);">${t} :</strong> ${d}</div>
          </div>`).join('')}
        </div>

        <div class="box" style="background:var(--apale);border-color:var(--accent);">
          <div class="bh" style="color:var(--accent);border-color:rgba(201,168,76,.3);"><div class="bia">!</div> STRUCTURE PAR CYCLE</div>
          <div style="display:flex;flex-direction:column;gap:1.5mm;font-size:6.5pt;font-family:Arial;color:var(--dark);">
            ${[
              ['A','Couverture cycle + Priorités'],
              ['B','Carte des 31 jours'],
              ['C','Planificateur semaine (×4–5)'],
              ['D','Suivi : Collecte · Délégations · En attente'],
              ['E','Revue de cycle'],
              ['F','Notes (grille)']
            ].map(([l,t])=>`<div style="display:flex;gap:3mm;align-items:center;">
              <span style="background:var(--dark);color:white;padding:1px 4px;border-radius:2px;font-size:5.5pt;min-width:14px;text-align:center;">${l}</span>
              ${t}
            </div>`).join('')}
          </div>
        </div>
      </div>
    </div>
    ${pf('LE CLASSEUR DU DIRIGEANT — 2026','FOCUS 31 JOURS')}
  </div>`;
}

// ═══════════════════════════════════════════
// PAGE: ANNUAIRE A–Z
// ═══════════════════════════════════════════
function genAZ(){
  const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  return `<div class="page" id="annuaire" style="position:relative;">
    <div class="sh"><span class="sn">AZ</span> COMMUNICATION A–Z <span class="sr">Répertoire actif — qui, quoi, quand relancer</span></div>
    <div class="pc" style="padding-top:4mm;padding-right:16mm;">
      <table class="dt" style="font-size:5.5pt;">
        <thead><tr>
          <th style="width:30mm;">Nom / Organisation</th>
          <th style="width:20mm;">Fonction</th>
          <th style="width:32mm;">Téléphone / E-mail</th>
          <th>Sujet / Promesse</th>
          <th style="width:28mm;">Prochaine action</th>
          <th style="width:13mm;text-align:center;">Relance J</th>
          <th style="width:8mm;text-align:center;">✓</th>
        </tr></thead>
        <tbody>
          ${Array(28).fill(0).map(()=>`<tr>
            <td></td><td></td><td></td><td></td><td></td><td></td>
            <td class="c"><span class="dot"></span></td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>

// ═══════════════════════════════════════════
// PAGE: CARTE DES 31 JOURS
// ═══════════════════════════════════════════
function genDayMap(m){
  const rows=Array(31).fill(0).map((_,i)=>{
    const valid=i<m.days;
    const d=new Date(m.start);d.setDate(d.getDate()+i);
    const dow=valid?JSHORT[d.getDay()]:'';
    const ds=valid?fmtShort(d):'';
    const op=valid?'':'opacity:.2;';
    return `<tr style="${op}">
      <td class="c" style="font-weight:bold;color:${valid?'var(--accent)':'var(--muted)'};font-family:Arial;">${p2(i+1)}</td>
      <td style="font-size:5.5pt;color:var(--muted);">${dow}</td>
      <td style="font-size:5.5pt;color:var(--muted);">${ds}</td>
      <td></td>
      <td style="width:38mm;"></td>
      <td style="width:16mm;"></td>
    </tr>`;
  });
  return `<div class="page">
    <div class="sh"><span class="sn">03</span> CARTE DES 31 JOURS <span class="sr">Cycle ${p2(m.n)} — ${m.fr} 2026</span></div>
    <div class="pc" style="padding-top:4mm;">
      <p class="intro">Vue d'ensemble : donnez une place à chaque jour avant de le remplir.</p>
      <table class="dt">
        <thead><tr>
          <th style="width:9mm;text-align:center;">J</th>
          <th style="width:9mm;"></th>
          <th style="width:22mm;">Date</th>
          <th>Focus / Rendez-vous majeur</th>
          <th style="width:38mm;">Action P1</th>
          <th style="width:16mm;">Point contrôle</th>
        </tr></thead>
        <tbody>${rows.join('')}</tbody>
      </table>
      <div style="margin-top:3mm;font-size:5.5pt;color:var(--muted);font-family:Arial;font-style:italic;">
        Une ligne = un engagement de focus. Les nouvelles tâches commencent dans la liste de collecte.
      </div>
    </div>
    ${pf('LE CLASSEUR DU DIRIGEANT — 2026',`CYCLE ${p2(m.n)} — CARTE`)}
  </div>`;
}

            <div class="bh"><div class="bi">*</div> NOTES DE SEMAINE</div>

// ═══════════════════════════════════════════
// GENERATE ALL
// ═══════════════════════════════════════════
function generateAll(){
  let html='';
  const cycleLinks=[];

  html+=genCover();
  html+=genIdentityIntro();
  html+=genAZ();

  MONTHS.forEach(m=>{
    cycleLinks.push(`<a href="#cycle-${p2(m.n)}">${m.fr.slice(0,4)}</a>`);

    const weeks=getWeeks(m);
    const total=weeks.length;

    // A — Couverture + Priorités
    html+=genCyclePrio(m);

    // B — Carte 31 jours
    html+=genDayMap(m);

    // C — Planificateurs semaine
    weeks.forEach((wk,wi)=>{
      html+=genWeekPlan(m,wk,wi+1,total);
    });

    // D — Suivi
    html+=genSuivi(m);

    // E — Revue de cycle
    html+=genReview(m);

    // F — Notes
    html+=genNotes(m);
  });

  document.getElementById('planner').innerHTML=html;
  document.getElementById('cyclelinks').innerHTML=cycleLinks.join('');
}

generateAll();
