<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Classeur du Dirigeant 2026</title>
<style>
:root {
  --dark: #1e293b;
  --darker: #0f172a;
  --accent: #6366f1;
  --accent-light: #818cf8;
  --accent-pale: #e0e7ff;
  --warm: #a5b4fc;
  --text-light: #f8fafc;
  --text-muted: #94a3b8;
  --text-dark: #1e293b;
  --border: #e2e8f0;
  --line: #f1f5f9;
  --surface: #f8fafc;
  --white: #ffffff;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Georgia', 'Times New Roman', serif;
  background: #cbd5e1;
  color: var(--text-dark);
}

.sans { font-family: 'Arial', 'Helvetica Neue', sans-serif; }

/* ============================================
   PAGE SETUP
   ============================================ */
.page {
  width: 210mm;
  min-height: 297mm;
  height: 297mm;
  background: white;
  margin: 8mm auto;
  position: relative;
  overflow: hidden;
  page-break-after: always;
  page-break-inside: avoid;
}

@media print {
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  body { background: white; }
  .page { margin: 0; box-shadow: none; page-break-after: always; page-break-inside: avoid; }
  .no-print { display: none !important; }
  @page { size: A4; margin: 0; }
}

/* ============================================
   NAVIGATION BAR (screen only)
   ============================================ */
#navbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  background: var(--darker);
  color: white;
  padding: 10px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  z-index: 1000;
  font-family: Arial, sans-serif;
  font-size: 13px;
  flex-wrap: wrap;
}
#navbar strong { color: var(--accent-light); font-size: 14px; }
#navbar a {
  color: var(--text-muted);
  text-decoration: none;
  padding: 4px 10px;
  border-radius: 4px;
  transition: background 0.2s;
}
#navbar a:hover { background: rgba(99,102,241,0.3); color: white; }
#navbar .sep { color: #334155; }
#print-btn {
  margin-left: auto;
  background: var(--accent);
  color: white;
  border: none;
  padding: 6px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  font-family: Arial, sans-serif;
}
#print-btn:hover { background: var(--accent-light); }
#planner { padding-top: 56px; }

/* ============================================
   DARK PAGE (covers)
   ============================================ */
.page-dark {
  background: var(--darker) !important;
  color: var(--text-light);
}
.page-dark-accent {
  background: var(--dark) !important;
  color: var(--text-light);
}

/* ============================================
   COVER PAGE
   ============================================ */
.cover-page {
  background: var(--darker) !important;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20mm;
  position: relative;
}
.cover-page::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--accent), var(--accent-light));
}
.cover-page::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--accent-light), var(--accent));
}
.cover-inner {
  border: 1.5px solid rgba(99,102,241,0.4);
  border-radius: 4px;
  padding: 20mm 18mm;
  width: 100%;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10mm;
}
.cover-logo {
  width: 22mm; height: 22mm;
  border-radius: 50%;
  border: 2px solid var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-family: Arial, sans-serif;
  font-size: 18pt;
  font-weight: bold;
  color: var(--accent-light);
  letter-spacing: 1px;
}
.cover-title {
  font-size: 28pt;
  font-weight: bold;
  color: var(--text-light);
  letter-spacing: 2px;
  line-height: 1.2;
}
.cover-year {
  font-size: 18pt;
  color: var(--accent-light);
  letter-spacing: 4px;
  font-family: Arial, sans-serif;
  font-weight: 300;
}
.cover-divider {
  width: 20mm;
  height: 2px;
  background: var(--accent);
  border-radius: 1px;
}
.cover-tagline {
  font-size: 8pt;
  color: var(--text-muted);
  letter-spacing: 3px;
  text-transform: uppercase;
  font-family: Arial, sans-serif;
}
.cover-right-bar {
  position: absolute;
  right: 0; top: 15mm; bottom: 15mm;
  width: 10mm;
  background: var(--accent);
  border-radius: 0 0 0 0;
  opacity: 0.8;
}

/* ============================================
   SECTION HEADER
   ============================================ */
.section-header {
  background: var(--dark);
  color: var(--text-light);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 12px;
  font-family: Arial, sans-serif;
  font-size: 7.5pt;
  font-weight: bold;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.section-num {
  background: var(--accent);
  color: white;
  padding: 2px 7px;
  border-radius: 2px;
  font-size: 7pt;
  font-weight: bold;
  min-width: 20px;
  text-align: center;
}
.section-subtitle {
  font-size: 6.5pt;
  color: var(--text-muted);
  margin-top: 4px;
  font-family: Arial, sans-serif;
  letter-spacing: 0.5px;
}

/* ============================================
   PAGE FOOTER
   ============================================ */
.page-footer {
  position: absolute;
  bottom: 6mm;
  left: 12mm; right: 12mm;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 5.5pt;
  color: #94a3b8;
  font-family: Arial, sans-serif;
  border-top: 0.5px solid #e2e8f0;
  padding-top: 3px;
  letter-spacing: 0.5px;
}

/* ============================================
   PAGE CONTENT AREA
   ============================================ */
.page-content {
  padding: 8mm 12mm 16mm 12mm;
}
.page-intro {
  font-size: 7.5pt;
  color: var(--text-muted);
  font-family: Arial, sans-serif;
  margin-bottom: 6mm;
  font-style: italic;
}

/* ============================================
   BOXES / CARDS
   ============================================ */
.box {
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 5mm;
  margin-bottom: 4mm;
}
.box-header {
  font-size: 7pt;
  font-weight: bold;
  color: var(--dark);
  letter-spacing: 0.8px;
  text-transform: uppercase;
  font-family: Arial, sans-serif;
  margin-bottom: 3mm;
  display: flex;
  align-items: center;
  gap: 5px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 2mm;
}
.box-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 14px; height: 14px;
  background: var(--accent);
  color: white;
  border-radius: 50%;
  font-size: 7pt;
  font-weight: bold;
}
.box-icon-sq {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 14px; height: 14px;
  background: var(--dark);
  color: white;
  border-radius: 2px;
  font-size: 7pt;
  font-weight: bold;
}

/* ============================================
   RULED LINES
   ============================================ */
.lines { }
.line {
  border-bottom: 0.5px solid var(--line);
  min-height: 7mm;
  margin-bottom: 0;
}
.line-sm { min-height: 5.5mm; }
.line-md { min-height: 8mm; }
.line-lg { min-height: 11mm; }

/* ============================================
   TABLES
   ============================================ */
.data-table {
  width: 100%;
  border-collapse: collapse;
  font-family: Arial, sans-serif;
  font-size: 6.5pt;
}
.data-table th {
  background: var(--dark);
  color: var(--text-light);
  padding: 3px 5px;
  text-align: left;
  font-size: 6pt;
  font-weight: bold;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  white-space: nowrap;
}
.data-table td {
  border-bottom: 0.5px solid var(--line);
  padding: 1.5px 5px;
  min-height: 6.5mm;
  height: 6.5mm;
  vertical-align: bottom;
}
.data-table td.center { text-align: center; }
.data-table tr:nth-child(even) td { background: rgba(241,245,249,0.5); }

/* ============================================
   CHECKBOXES / CIRCLES
   ============================================ */
.cb {
  display: inline-block;
  width: 9px; height: 9px;
  border: 1px solid #94a3b8;
  border-radius: 1px;
  vertical-align: middle;
  flex-shrink: 0;
}
.circle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 16px; height: 16px;
  border: 1.5px solid var(--accent);
  border-radius: 50%;
  font-size: 7pt;
  font-weight: bold;
  color: var(--accent);
  font-family: Arial, sans-serif;
  flex-shrink: 0;
}
.dot {
  width: 7px; height: 7px;
  border: 1px solid #94a3b8;
  border-radius: 50%;
  display: inline-block;
  flex-shrink: 0;
}

/* ============================================
   TWO COLUMN LAYOUT
   ============================================ */
.cols {
  display: flex;
  gap: 4mm;
}
.col { flex: 1; }
.col-2-3 { flex: 2; }
.col-1-3 { flex: 1; }

/* ============================================
   CYCLE COVER PAGE
   ============================================ */
.cycle-cover {
  background: var(--dark) !important;
  color: var(--text-light);
  display: flex;
  flex-direction: column;
  padding: 18mm 15mm;
  position: relative;
}
.cycle-cover-label {
  font-size: 7.5pt;
  letter-spacing: 3px;
  color: var(--text-muted);
  text-transform: uppercase;
  font-family: Arial, sans-serif;
  margin-bottom: 2mm;
}
.cycle-cover-label::after {
  content: '';
  display: block;
  width: 20mm;
  height: 2px;
  background: var(--accent);
  margin-top: 3mm;
}
.cycle-cover-num {
  font-size: 72pt;
  font-weight: bold;
  color: var(--accent-light);
  line-height: 1;
  margin: 4mm 0 2mm 0;
}
.cycle-cover-month {
  font-size: 22pt;
  font-weight: bold;
  color: var(--text-light);
  letter-spacing: 2px;
  margin-bottom: 8mm;
}
.cycle-cover-dates {
  font-size: 9pt;
  color: var(--text-muted);
  font-family: Arial, sans-serif;
  margin-bottom: 12mm;
  display: flex;
  flex-direction: column;
  gap: 3mm;
}
.cycle-cover-dates span {
  display: flex;
  align-items: center;
  gap: 6mm;
}
.cycle-cover-dates span strong {
  color: var(--accent-light);
  font-size: 7pt;
  letter-spacing: 1px;
  text-transform: uppercase;
  width: 20mm;
}
.cycle-cover-dates span em {
  border-bottom: 1px solid rgba(99,102,241,0.4);
  width: 50mm;
  display: inline-block;
  height: 6mm;
  font-style: normal;
}
.cycle-cover-cap {
  font-size: 7.5pt;
  color: var(--text-muted);
  font-family: Arial, sans-serif;
  margin-bottom: 3mm;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.cycle-cover-caplines {
  display: flex;
  flex-direction: column;
  gap: 3mm;
}
.cycle-cover-capline {
  border-bottom: 1px solid rgba(99,102,241,0.3);
  height: 7mm;
}
.cycle-cover-tag {
  position: absolute;
  right: 0;
  top: 18mm;
  background: var(--accent);
  color: white;
  padding: 4mm 3mm 4mm 4mm;
  writing-mode: vertical-rl;
  text-orientation: mixed;
  transform: rotate(180deg);
  font-size: 8pt;
  font-weight: bold;
  font-family: Arial, sans-serif;
  letter-spacing: 2px;
  min-height: 40mm;
  display: flex;
  align-items: center;
  justify-content: center;
}
.cycle-cover-footer {
  position: absolute;
  bottom: 8mm;
  left: 15mm; right: 15mm;
  font-size: 6pt;
  color: rgba(148,163,184,0.5);
  letter-spacing: 2px;
  text-transform: uppercase;
  font-family: Arial, sans-serif;
}

/* ============================================
   INTRO PAGE
   ============================================ */
.intro-section {
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 4mm 5mm;
  margin-bottom: 4mm;
}
.intro-section-header {
  font-size: 7.5pt;
  font-weight: bold;
  font-family: Arial, sans-serif;
  color: var(--dark);
  letter-spacing: 1px;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 5px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 2mm;
  margin-bottom: 3mm;
}
.intro-text {
  font-size: 8pt;
  color: #374151;
  line-height: 1.6;
}
.proto-step {
  display: flex;
  align-items: flex-start;
  gap: 4mm;
  margin-bottom: 3mm;
}
.proto-num {
  width: 16px; height: 16px;
  min-width: 16px;
  background: var(--accent);
  color: white;
  border-radius: 50%;
  font-size: 7.5pt;
  font-weight: bold;
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 1px;
}
.proto-text {
  font-size: 8pt;
  color: #374151;
  line-height: 1.5;
}
.rdv-item {
  display: flex;
  align-items: flex-start;
  gap: 3mm;
  margin-bottom: 2.5mm;
}
.rdv-dot {
  width: 6px; height: 6px;
  background: var(--accent);
  border-radius: 50%;
  margin-top: 4px;
  flex-shrink: 0;
}

/* ============================================
   IDENTITY PAGE
   ============================================ */
.id-field {
  display: flex;
  align-items: flex-end;
  gap: 4mm;
  margin-bottom: 5mm;
}
.id-label {
  font-size: 8pt;
  color: var(--dark);
  font-family: Arial, sans-serif;
  white-space: nowrap;
  min-width: 28mm;
}
.id-line {
  flex: 1;
  border-bottom: 1px solid var(--dark);
  height: 5mm;
}

/* ============================================
   PRIORITY BLOCKS (page 04)
   ============================================ */
.priority-item {
  display: flex;
  align-items: flex-start;
  gap: 3mm;
  margin-bottom: 2mm;
}
.priority-sq {
  width: 12px; height: 12px;
  min-width: 12px;
  background: var(--dark);
  border-radius: 2px;
  margin-top: 2px;
}

/* ============================================
   DAILY PLAN (page 05)
   ============================================ */
.daily-result-box {
  border: 1px solid var(--border);
  border-radius: 3px;
  min-height: 12mm;
  padding: 2mm 3mm;
  margin-bottom: 4mm;
  background: var(--surface);
}
.daily-result-label {
  font-size: 6.5pt;
  color: var(--text-muted);
  font-family: Arial, sans-serif;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 1.5mm;
}
.daily-meta {
  display: flex;
  justify-content: space-between;
  margin-bottom: 3mm;
  font-family: Arial, sans-serif;
  font-size: 7pt;
  color: var(--text-muted);
}
.daily-meta span { display: flex; align-items: center; gap: 2mm; }
.daily-meta strong { color: var(--dark); }

/* Schedule table */
.schedule-table {
  width: 100%;
  border-collapse: collapse;
  font-family: Arial, sans-serif;
  font-size: 6.5pt;
  margin-bottom: 3mm;
}
.schedule-table th {
  background: var(--dark);
  color: white;
  padding: 2.5px 5px;
  text-align: left;
  font-size: 6pt;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.schedule-table td {
  border-bottom: 0.5px solid var(--line);
  padding: 0 5px;
  height: 6.5mm;
  vertical-align: bottom;
}
.schedule-table .col-time { width: 14mm; }
.schedule-table .col-agenda { width: auto; }
.schedule-table .col-action { width: 35mm; }
.schedule-table .col-p { width: 7mm; text-align: center; }
.schedule-table .col-done { width: 9mm; text-align: center; }

/* ============================================
   WEEKLY REVIEW
   ============================================ */
.week-box {
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 3mm 4mm;
}
.week-box-header {
  font-size: 6.5pt;
  font-weight: bold;
  font-family: Arial, sans-serif;
  color: var(--accent);
  letter-spacing: 1px;
  text-transform: uppercase;
  border-bottom: 1px solid var(--border);
  padding-bottom: 2mm;
  margin-bottom: 2.5mm;
  display: flex;
  align-items: center;
  gap: 4px;
}

/* ============================================
   DOT GRID (notes page)
   ============================================ */
.dot-grid {
  border: 1px solid var(--border);
  border-radius: 3px;
  background-image: radial-gradient(circle, #d1d5db 0.8px, transparent 0.8px);
  background-size: 5mm 5mm;
  background-position: 3mm 3mm;
  flex: 1;
  min-height: 180mm;
}

/* ============================================
   DASHBOARD SCALES
   ============================================ */
.scale-row {
  display: flex;
  align-items: center;
  gap: 3mm;
  margin-bottom: 2.5mm;
  font-family: Arial, sans-serif;
  font-size: 7pt;
}
.scale-label { min-width: 40mm; color: var(--dark); }
.scale-dots { display: flex; gap: 2.5mm; }
.scale-dot {
  width: 9px; height: 9px;
  border: 1px solid #94a3b8;
  border-radius: 50%;
}

/* ============================================
   CONTACT DIRECTORY (A-Z)
   ============================================ */
.az-index {
  position: absolute;
  right: 3mm;
  top: 25mm;
  display: flex;
  flex-direction: column;
  gap: 1.5px;
}
.az-letter {
  font-size: 5.5pt;
  font-family: Arial, sans-serif;
  color: var(--text-muted);
  text-align: center;
  width: 7mm;
  padding: 1.5px;
  background: var(--line);
  border-radius: 1px;
  line-height: 1;
}

/* ============================================
   ACCENT TAGS / BADGES
   ============================================ */
.badge {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 3px;
  font-size: 6pt;
  font-family: Arial, sans-serif;
  font-weight: bold;
  letter-spacing: 0.5px;
}
.badge-accent { background: var(--accent-pale); color: var(--accent); }
.badge-dark { background: var(--dark); color: white; }

/* ============================================
   PROJECT SHEET
   ============================================ */
.project-meta {
  display: flex;
  gap: 8mm;
  margin-bottom: 4mm;
  font-family: Arial, sans-serif;
  font-size: 7.5pt;
}
.project-meta-field {
  display: flex;
  align-items: flex-end;
  gap: 3mm;
  flex: 1;
}
.project-meta-label {
  color: var(--text-muted);
  white-space: nowrap;
  font-size: 7pt;
}
.project-meta-line {
  flex: 1;
  border-bottom: 1px solid var(--border);
  height: 5mm;
}

/* ============================================
   INDIGO STRIPE (left of some pages)
   ============================================ */
.stripe-left {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3mm;
  background: var(--accent);
}
</style>
</head>
<body>

<!-- NAVIGATION BAR (screen only) -->
<div id="navbar" class="no-print">
  <strong>Le Classeur du Dirigeant 2026</strong>
  <span class="sep">|</span>
  <a href="#cover">Couverture</a>
  <a href="#intro">Introduction</a>
  <a href="#annuaire">Annuaire</a>
  <span id="cycle-links"></span>
  <button id="print-btn" onclick="window.print()">Imprimer / PDF</button>
</div>

<div id="planner"></div>

<script>
// ============================================================
// DATA
// ============================================================
const MONTHS = [
  { num: 1,  name: 'JANVIER',   name_fr: 'Janvier',   days: 31, start: new Date(2026, 0, 1) },
  { num: 2,  name: 'FÉVRIER',   name_fr: 'Février',   days: 28, start: new Date(2026, 1, 1) },
  { num: 3,  name: 'MARS',      name_fr: 'Mars',      days: 31, start: new Date(2026, 2, 1) },
  { num: 4,  name: 'AVRIL',     name_fr: 'Avril',     days: 30, start: new Date(2026, 3, 1) },
  { num: 5,  name: 'MAI',       name_fr: 'Mai',       days: 31, start: new Date(2026, 4, 1) },
  { num: 6,  name: 'JUIN',      name_fr: 'Juin',      days: 30, start: new Date(2026, 5, 1) },
  { num: 7,  name: 'JUILLET',   name_fr: 'Juillet',   days: 31, start: new Date(2026, 6, 1) },
  { num: 8,  name: 'AOÛT',      name_fr: 'Août',      days: 31, start: new Date(2026, 7, 1) },
  { num: 9,  name: 'SEPTEMBRE', name_fr: 'Septembre', days: 30, start: new Date(2026, 8, 1) },
  { num: 10, name: 'OCTOBRE',   name_fr: 'Octobre',   days: 31, start: new Date(2026, 9, 1) },
  { num: 11, name: 'NOVEMBRE',  name_fr: 'Novembre',  days: 30, start: new Date(2026, 10, 1) },
  { num: 12, name: 'DÉCEMBRE',  name_fr: 'Décembre',  days: 31, start: new Date(2026, 11, 1) }
];

const JOURS_FR = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const MOIS_FR  = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];

function fmtDate(d) {
  return `${JOURS_FR[d.getDay()]} ${d.getDate()} ${MOIS_FR[d.getMonth()]} 2026`;
}
function fmtShort(d) {
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  return `${dd}/${mm}/2026`;
}
function pad(n) { return String(n).padStart(2,'0'); }
function lines(n, cls='') {
  return Array(n).fill(`<div class="line ${cls}"></div>`).join('');
}
function cbLines(n) {
  return Array(n).fill(0).map((_,i) =>
    `<div class="line" style="display:flex;align-items:flex-end;gap:3mm;padding-bottom:1.5px;">
      <span class="cb"></span>
      <div style="flex:1;border-bottom:0.5px solid #f1f5f9;"></div>
    </div>`
  ).join('');
}
function dotLines(n) {
  return Array(n).fill(0).map(() =>
    `<div class="line" style="display:flex;align-items:flex-end;gap:3mm;padding-bottom:1.5px;">
      <span class="dot"></span>
      <div style="flex:1;border-bottom:0.5px solid #f1f5f9;"></div>
    </div>`
  ).join('');
}
function numLines(n) {
  return Array(n).fill(0).map((_,i) =>
    `<div class="line" style="display:flex;align-items:flex-end;gap:3mm;padding-bottom:1.5px;">
      <span style="font-size:7pt;color:#94a3b8;font-family:Arial;min-width:8px;">${i+1}.</span>
      <div style="flex:1;border-bottom:0.5px solid #f1f5f9;"></div>
    </div>`
  ).join('');
}

function footer(left, right) {
  return `<div class="page-footer">

    <span>${right}</span>

}

            <th>Contexte / Options</th>
            <th style="width:22mm;">Risque accepté</th>
            <th style="width:28mm;">Personnes concernées</th>
            <th style="width:18mm;">À réviser le</th>
          </tr>
        </thead>
        <tbody>
          ${Array(rows).fill(0).map(() => `<tr>
            <td style="height:8mm;"></td><td></td><td></td><td></td><td></td><td></td>
          </tr>`).join('')}
        </tbody>
      </table>
      <div class="box" style="margin-top:4mm;">
        <div class="box-header"><div class="box-icon">!</div> PRINCIPES DE DÉCISION DU CYCLE</div>
        ${cbLines(4)}
      </div>
    </div>
    ${footer('LE CLASSEUR DU DIRIGEANT — 2026','FOCUS 31 JOURS')}
  </div>`;
}

// ============================================================
// PAGE 19 — NOTES ET IDÉES
// ============================================================
function genNotes(m) {
  return `<div class="page">
    <div class="section-header">
      <span class="section-num">19</span>
      NOTES ET IDÉES
      <span style="margin-left:auto;font-size:6.5pt;color:var(--text-muted);">Cycle ${pad(m.num)} — ${m.name_fr}</span>
    </div>
    <div class="page-content" style="padding-top:4mm;display:flex;flex-direction:column;height:calc(297mm - 20mm);">
      <p class="page-intro">Espace libre : idées, observations, apprentissages, opportunités et préparations.</p>
      <div class="dot-grid" style="flex:1;"></div>
    </div>
    ${footer('LE CLASSEUR DU DIRIGEANT — 2026','FOCUS 31 JOURS')}
  </div>`;
}

// ============================================================
// GENERATE ALL
// ============================================================
function generateAll() {
  let html = '';
  const cycleLinks = [];

  // Couverture + Identité + Intro
  html += genCover();
  html += genIdentity();
  html += genIntro();

  // Annuaire A-Z (une fois)
  html += genContactDir();

  // 12 cycles
  MONTHS.forEach(m => {
    cycleLinks.push(`<a href="#cycle-${pad(m.num)}">${m.name_fr}</a>`);
    const end = new Date(m.start);
    end.setDate(end.getDate() + m.days - 1);

    // Cycle cover
    html += genCycleCover(m);

    // Page 04 — Priorités
    html += genPriorities(m);

    // Page 03 — Carte des 31 jours
    html += genDayMap(m);

    // Page 05 — Plans du jour (1 par jour)
    for (let d = 0; d < m.days; d++) {
      const date = new Date(m.start);
      date.setDate(date.getDate() + d);
      html += genDailyPlan(date, d + 1, m);
    }

    // Page 06 — Collecte
    html += genCollect(m);

    // Page 07 — Tâches priorisées
    html += genTaskList(m);

    // Page 09 — Suivi communications
    html += genCommTrack(m);

    // Page 10 — Conversation importante
    html += genConversation(m, 1);

    // Page 11 — Délégations
    html += genDelegations(m);

    // Page 12 — En attente
    html += genWaiting(m);

    // Page 13 — Réunion & CR
    html += genMeeting(m);

    // Page 14 — Fiche projet
    html += genProject(m);

    // Page 15 — Tableau de bord
    html += genDashboard(m);

    // Page 16 — Revues hebdo (4 semaines)
    for (let w = 1; w <= 4; w++) {
      html += genWeeklyReview(m, w);
    }

    // Page 17 — Revue de cycle
    html += genCycleReview(m);

    // Page 18 — Journal des décisions
    html += genDecisionLog(m);

    // Page 19 — Notes
    html += genNotes(m);
  });

  document.getElementById('planner').innerHTML = html;

  // Update nav cycle links
  const linkEl = document.getElementById('cycle-links');
  if (linkEl) linkEl.innerHTML = cycleLinks.join('');
}

// Run
generateAll();
</script>
</body>
</html>
